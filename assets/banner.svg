<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Accent Radial Glow -->
    <radialGradient id="clockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <style>
      @keyframes rotateClockHand {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes shimmerBar {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.7; }
      }
      .sec-hand {
        transform-origin: 1040px 180px;
        animation: rotateClockHand 12s linear infinite;
      }
      .min-hand {
        transform-origin: 1040px 180px;
        animation: rotateClockHand 60s linear infinite;
      }
      .hour-hand {
        transform-origin: 1040px 180px;
        animation: rotateClockHand 360s linear infinite;
      }
      .pulse-pill {
        animation: pulseDot 2.5s ease-in-out infinite;
        transform-origin: 105px 65px;
      }
      .float-badge {
        animation: floatSoft 4s ease-in-out infinite;
      }
      .shimmer-1 { animation: shimmerBar 3s ease-in-out infinite; }
      .shimmer-2 { animation: shimmerBar 3s ease-in-out 1s infinite; }
      .shimmer-3 { animation: shimmerBar 3s ease-in-out 2s infinite; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base with Rounded Border -->
  <rect x="2" y="2" width="1196" height="356" rx="20" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="3" />

  <!-- Background Grid -->
  <rect x="4" y="4" width="1192" height="352" rx="18" fill="url(#grid)" />

  <!-- Ambient Dynamic Glows in Background (Behind Text) -->
  <circle cx="1040" cy="180" r="140" fill="url(#clockGlow)" />
  <circle cx="150" cy="90" r="120" fill="#6366f1" fill-opacity="0.08" />

  <!-- Background Animated Timesheet Bars (Subtle & In Background) -->
  <g opacity="0.35">
    <rect x="760" y="70" width="80" height="8" rx="4" fill="#38bdf8" class="shimmer-1" />
    <rect x="850" y="70" width="110" height="8" rx="4" fill="#818cf8" class="shimmer-2" />
    <rect x="760" y="86" width="130" height="8" rx="4" fill="#c084fc" class="shimmer-3" />
    <rect x="900" y="86" width="60" height="8" rx="4" fill="#38bdf8" class="shimmer-1" />
    <rect x="760" y="266" width="100" height="8" rx="4" fill="#818cf8" class="shimmer-2" />
    <rect x="870" y="266" width="90" height="8" rx="4" fill="#38bdf8" class="shimmer-3" />
    <rect x="760" y="282" width="60" height="8" rx="4" fill="#c084fc" class="shimmer-1" />
    <rect x="830" y="282" width="130" height="8" rx="4" fill="#818cf8" class="shimmer-2" />
  </g>

  <!-- Foreground Dynamic Analog Time Card Dial (Right Side) -->
  <g class="float-badge">
    <!-- Dial Outer Ring -->
    <circle cx="1040" cy="180" r="95" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <circle cx="1040" cy="180" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.7" />

    <!-- Clock Hour Markers -->
    <line x1="1040" y1="95" x2="1040" y2="107" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="1040" y1="253" x2="1040" y2="265" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="955" y1="180" x2="967" y2="180" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="1113" y1="180" x2="1125" y2="180" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Clock Sub-dials / Progress Arc -->
    <path d="M 985 180 A 55 55 0 0 1 1075 135" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 1005 210 A 45 45 0 0 0 1065 215" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Rotating Clock Hands -->
    <line class="hour-hand" x1="1040" y1="180" x2="1040" y2="135" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" />
    <line class="min-hand" x1="1040" y1="180" x2="1040" y2="115" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line class="sec-hand" x1="1040" y1="180" x2="1040" y2="105" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="1040" cy="180" r="5" fill="#f8fafc" stroke="#ec4899" stroke-width="2" />

    <!-- Time Card Stamp Label -->
    <rect x="990" y="215" width="100" height="22" rx="11" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="1040" y="230" fill="#38bdf8" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">APPROVED</text>
  </g>

  <!-- Foreground Content: Header Status Badge -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="285" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="14" r="5" fill="#10b981" class="pulse-pill" />
    <text x="32" y="19" fill="#94a3b8" class="pill-text" font-size="12">CURATED ECOSYSTEM • 2026</text>
    <rect x="200" y="4" width="75" height="20" rx="10" fill="#0284c7" />
    <text x="237" y="18" fill="#ffffff" class="pill-text" font-size="11" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Foreground Primary Title & Subtitle -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" class="title-text" font-size="44">Awesome Time Card Management</text>
    <text x="0" y="42" class="subtitle-text" font-size="19">Timesheet Tracking • Project Billing • Workforce Time Intelligence</text>
    <text x="0" y="72" class="subtitle-text" font-size="14" fill="#64748b">Top enterprise SaaS platforms and battle-tested self-hosted open-source software</text>
  </g>

  <!-- Foreground Feature Pills (Bottom Row) -->
  <g transform="translate(60, 275)">
    <!-- Pill 1: Timesheet Logging -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <text x="75" y="22" fill="#38bdf8" class="pill-text" text-anchor="middle">⏱️ Timesheets</text>
    </g>

    <!-- Pill 2: Project Billing -->
    <g transform="translate(162, 0)">
      <rect x="0" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <text x="80" y="22" fill="#818cf8" class="pill-text" text-anchor="middle">💼 Project Billing</text>
    </g>

    <!-- Pill 3: Workforce Analytics -->
    <g transform="translate(334, 0)">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
      <text x="85" y="22" fill="#c084fc" class="pill-text" text-anchor="middle">📊 Time Intelligence</text>
    </g>

    <!-- Pill 4: Open Source & SaaS -->
    <g transform="translate(516, 0)">
      <rect x="0" y="0" width="175" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
      <text x="87" y="22" fill="#34d399" class="pill-text" text-anchor="middle">⚡ Open-Source &amp; SaaS</text>
    </g>
  </g>
</svg>
